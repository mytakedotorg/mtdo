name: CI

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: cimg/postgres:11.21
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Install JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: 17
      - name: gradle caching
        uses: gradle/gradle-build-action@v2
        with:
          gradle-home-cache-cleanup: true
      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 14
      - name: npm install
        run: npm install
        working-directory: ./client
      - name: gradlew jsweet
        run: ./gradlew :client-interface:jsweet :lucene:indexHash
      - name: npm test
        run: npm run test_ci
        working-directory: ./client
      - name: gradlew check
        run: ./gradlew check --build-cache
      - name: junit result
        uses: mikepenz/action-junit-report@v3
        if: always() # always run even if the previous step fails
        with:
          check_name: JUnit
          report_paths: '*/build/test-results/*/TEST-*.xml'
      - name: Store image snapshot diffs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: image-snapshot-diffs
          path: node/src/main/scripts/__image_snapshots__/__diff_output__/
